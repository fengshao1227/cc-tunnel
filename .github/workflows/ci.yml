name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep shellcheck
      - name: Tests
        run: python3 -m unittest discover -s tests -v
      - name: Shellcheck
        run: |
          shellcheck -S warning \
            local/bin/cc-tunnel local/bin/cc-tunnel-router local/bin/cc-tunnel-link \
            remote/bin/* remote/install.sh install.sh scripts/*.sh
      - name: Nothing private in the tree
        run: bash scripts/check-publishable.sh

  macos:
    # The workspace server runs under /usr/bin/python3 on macOS (what a
    # non-interactive ssh session finds first), so test with exactly that.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install ripgrep
      - name: Tests under the system python3
        run: /usr/bin/python3 -m unittest discover -s tests -v
